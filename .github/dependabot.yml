version: 2
updates:
  # Action updates edit workflow files, including guardrail workflows (pr-policy.yml,
  # ready-gate.yml) that may only change in a design PR. So they're labelled design, and
  # grouped into one PR a week so they don't conflict with each other.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [design]
    groups:
      github-actions:
        patterns: ["*"]

  # Rust and npm updates only change manifests and lock files, which the PR policy allows in
  # fast-lane PRs. One grouped PR per ecosystem a week (spec 001, FR-015).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [fast-lane]
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # num-bigint must match the version num-rational uses (uni-time's test oracle), and
      # num-rational 0.4 still uses num-bigint 0.4 (Dependabot PR #26). Remove this when
      # num-rational moves on (issue #33).
      - dependency-name: num-bigint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [fast-lane]
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x doesn't support TypeScript 7 yet, so npm can't install the pair
      # (Dependabot PR #15). Remove this once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
