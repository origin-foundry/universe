version: 2
updates:
  # Action updates edit workflow files, including guardrail workflows (pr-policy.yml,
  # ready-gate.yml) that may only change in a design PR. So they're labelled design, and
  # grouped into one PR a week so they don't conflict with each other.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [design]
    groups:
      github-actions:
        patterns: ["*"]

  # Rust and npm updates only change manifests and lock files, which the PR policy allows in
  # fast-lane PRs. One grouped PR per ecosystem a week (spec 001, FR-015).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [fast-lane]
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [fast-lane]
    groups:
      npm:
        patterns: ["*"]
