name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.parts.outputs.rust }}
      ui: ${{ steps.parts.outputs.ui }}
      tauri: ${{ steps.parts.outputs.tauri }}
    steps:
      - uses: actions/checkout@v7
      - id: parts
        run: |
          echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ui=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tauri=$([ -f crates/uni-app/tauri.conf.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  knowledge:
    name: knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Validate knowledge bundle
        run: python scripts/check_okf.py knowledge
      - name: Check for personal or machine-specific details
        run: python scripts/check_privacy.py
      - name: Test repository scripts
        run: python -m unittest discover -s scripts/tests -v

  rust:
    name: rust (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app crate is Windows-only; on Linux it would need WebKitGTK (research.md, R6).
          - os: ubuntu-latest
            scope: --workspace --exclude uni-app
          - os: windows-latest
            scope: --workspace
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy ${{ matrix.scope }} --all-targets -- -D warnings
      - run: cargo test ${{ matrix.scope }}

  architecture:
    name: architecture
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain (cargo metadata needs it)
        run: rustup toolchain install
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - name: Test the architecture check against its fixtures
        run: python -m unittest discover -s scripts/tests -p test_check_architecture.py -v
      - name: Check the crate layout and the float ban
        run: python scripts/check_architecture.py

  rust-deps:
    name: rust-deps
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  ui:
    name: ui
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high

  app-build:
    name: app-build (windows)
    needs: [detect, rust, ui]
    if: ${{ !cancelled() && needs.detect.outputs.tauri == 'true' && !contains(needs.*.result, 'failure') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run tauri -- build --no-bundle
