[package]
name = "uni-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Path-only workspace dependencies: never published, and this keeps cargo-deny happy.
publish = false

[lints]
workspace = true

[dependencies]
uni-calendar = { path = "../uni-calendar" }
uni-time = { path = "../uni-time" }
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "serialize"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
