[package]
name = "uni-app"
description = "The Universe desktop app: Tauri commands, background jobs and progress events."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "uni_app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
uni-store = { path = "../uni-store" }
tauri-plugin-dialog = "2.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
